name: cabu

services:
  db:
    image: postgres:15
    restart: unless-stopped
    env_file:
      - ../../env/.env.shared
      - ../../env/.env.backend
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-stock_community_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /app
    command: bash -lc "bundle exec rails db:prepare && rm -f tmp/pids/server.pid && bin/rails s -b 0.0.0.0 -p ${BACKEND_PORT:-3000}"
    volumes:
      - ../../backend:/app
    ports:
      - "${BACKEND_PORT:-3000}:${BACKEND_PORT:-3000}"
    depends_on:
      - db
      - redis
    env_file:
      - ../../env/.env.shared
      - ../../env/.env.backend
    environment:
      RAILS_ENV: ${RAILS_ENV:-development}
      POSTGRES_HOST: db
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:password@db:5432/stock_community_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}

  frontend:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    command: sh -lc "npm ci && npm run dev -- --hostname 0.0.0.0 --port ${FRONTEND_PORT:-3001}"
    volumes:
      - ../../frontend:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-3001}:${FRONTEND_PORT:-3001}"
    depends_on:
      - backend
    env_file:
      - ../../env/.env.shared
      - ../../env/.env.frontend
    environment:
      NEXT_TELEMETRY_DISABLED: "1"

volumes:
  db-data:
  frontend-node-modules:
