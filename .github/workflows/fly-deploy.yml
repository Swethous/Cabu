# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy
on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/fly-deploy.yml"
jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-group
      cancel-in-progress: false
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Wait for active Fly release
        run: |
          for i in {1..30}; do
            status=$(flyctl releases -a stock-community -j | ruby -rjson -e 'data = JSON.parse(STDIN.read); puts(data[0]["Status"])')
            if [ "$status" != "running" ]; then
              echo "Latest release status: $status"
              exit 0
            fi
            echo "Latest release is still running; waiting 20s..."
            sleep 20
          done
          echo "Timed out waiting for previous running release to finish"
          exit 1
      - run: flyctl deploy --remote-only --release-command-timeout 15m --wait-timeout 15m --deploy-retries 2
      - name: Show Fly logs on failure
        if: failure()
        run: flyctl logs -a stock-community --no-tail
