# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy
on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/fly-deploy.yml"
jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-group
      cancel-in-progress: false
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --skip-release-command --wait-timeout 15m --deploy-retries 2
      - name: Run migrations via SSH
        run: timeout 10m flyctl ssh console -a stock-community -C "bin/rails db:migrate"
      - name: Show Fly logs on failure
        if: failure()
        run: flyctl logs -a stock-community --no-tail
      - name: Show Fly release state on failure
        if: failure()
        run: flyctl releases -a stock-community
