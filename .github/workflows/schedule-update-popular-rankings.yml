name: Schedule Update Popular Rankings

on:
  schedule:
    - cron: "4,14,24,34,44,54 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    concurrency:
      group: schedule-update-popular-rankings
      cancel-in-progress: false
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Wake app machine
        run: curl -fsS --retry 6 --retry-delay 5 https://stock-community.fly.dev/api/v1/health
      - name: Run UpdatePopularRankingsJob
        run: timeout 20m flyctl ssh console -a stock-community -C "bin/rails runner 'UpdatePopularRankingsJob.perform_now'"
